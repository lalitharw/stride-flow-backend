services:

  backend:
    container_name: stride_flow_dev_backend
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - ../../.env
    volumes:
      - .:/var/www/html
    ports:
      - "9000:9000"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql
    restart: always
    environment:
      MYSQL_USER: "admin"
      MYSQL_PASSWORD: "1234"
      MYSQL_DATABASE: stride_flow
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-u","admin","-p1234"]
      interval: 5s
      retries: 10
      timeout: 5s
    ports:
     - "3302:3306"

  nginx:
    container_name: stride_flow_nginx_dev
    image: nginx:alpine
    ports:
     - "80:80"
    volumes:
     - .:/var/www/html
     - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
  
  phpmyadmin:
    image: phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
  


volumes:
  mysql_data: